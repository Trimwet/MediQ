<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>MediQ: Appointment &amp; Queue Management</title>
    <meta name="title" content="MediQ: Appointment &amp; Queue Management" />
    <meta
      name="description"
      content="Appointment &amp; Queue Management System. Patients book slots online; clinic staff see a live queue dashboard."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="#" />
    <meta property="og:title" content="MediQ" />
    <meta property="og:description" content="Appointment & Queue Management System" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="#" />
    <meta property="twitter:title" content="MediQ" />
    <meta property="twitter:description" content="Appointment & Queue Management System" />

    <!-- Boot loader styles: must be inline since Vite-injected CSS loads after JS -->
    <style>
      @keyframes wave-bar-bounce {
        0%, 80%, 100% { height: 0.35em; }
        40% { height: 1em; }
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: oklch(1 0 0);
      }
      .dark #boot-loader {
        background: oklch(0.129 0.042 264.695);
      }
      #boot-loader .wave-bar {
        display: inline-block;
        width: 0.25em;
        height: 0.35em;
        border-radius: 9999px;
        background: oklch(0.554 0.046 257.417);
        animation: wave-bar-bounce 1.2s ease-in-out infinite;
      }
      .dark #boot-loader .wave-bar {
        background: oklch(0.704 0.04 256.788);
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .wave-bar { animation: none; }
      }
    </style>
    <!-- font family: pre-paint class so chosen font applies before first paint -->
    <script>
      (function () {
        try {
          var c = document.cookie.match(/(?:^|;\s*)font=([^;]*)/);
          var v = '';
          if (c) { try { v = decodeURIComponent(c[1]); } catch(e) { v = c[1]; } }
          var root = document.documentElement.classList;
          root.remove('font-inter', 'font-manrope', 'font-system');
          if (v === 'inter' || v === 'manrope' || v === 'system') {
            root.add('font-' + v);
          } else {
            root.add('font-inter');
          }
        } catch (e) {
          document.documentElement.classList.add('font-inter');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical latin-subset font files so first paint uses the real font -->
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcCo3FwrK3iLTcviYwY.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high" />
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcCm3FwrK3iLTcvnUwQT9g.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggexSg.woff2" as="font" type="font/woff2" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#2563EB" />
  </head>

  <body>
    <!-- Static boot loader: visible before React hydrates, removed on mount -->
    <div id="boot-loader">
      <div style="display:flex;align-items:center;justify-content:center;gap:0.375rem;height:2.5rem;">
        <span class="wave-bar" style="animation-delay:0s"></span>
        <span class="wave-bar" style="animation-delay:0.12s"></span>
        <span class="wave-bar" style="animation-delay:0.24s"></span>
        <span class="wave-bar" style="animation-delay:0.36s"></span>
        <span class="wave-bar" style="animation-delay:0.48s"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
